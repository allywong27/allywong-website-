<!DOCTYPE html>

<html>
<head>
<title>school helper</title>
<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ffffff,#ffe3ef,#f7a8c9);
font-family:Arial,sans-serif;
}

.container{
display:flex;
flex-direction:column;
gap:20px;
}

button{
background:rgba(255,255,255,0.75);
color:#c94f84;
border:1px solid rgba(255,255,255,0.9);
padding:18px 34px;
border-radius:999px;
font-size:18px;
cursor:pointer;
box-shadow:0 10px 30px rgba(201,79,132,0.18);
}

button:hover{
background:white;
} </style>

</head>

<body>
<div class="container">
<button>homework help</button>
<button>study</button>
<button>essay help</button>
</div>
</body>
</html>
