<!DOCTYPE html>
<html>
<head>
  <title>allywong.com</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffffff, #ffe3ef, #f7a8c9);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .buttons {
      display: flex;
      gap: 25px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      background: rgba(255, 255, 255, 0.75);
      color: #c94f84;
      border: 1px solid rgba(255, 255, 255, 0.9);
      padding: 18px 34px;
      border-radius: 999px;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(201, 79, 132, 0.18);
    }

    button:hover {
      background: white;
      transform: translateY(-2px);
    }
  </style>
</head>

<body>
  <div class="buttons">
    <button onclick="window.location.href='school.html'">school helper</button>
    <button onclick="window.location.href='other.html'">other</button>
  </div>
</body>
</html>
